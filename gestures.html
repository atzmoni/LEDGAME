<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LedGame Gestures</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: camera on top with a live readout; below it a legend of gestures that lights up the one being performed. Single dark look. */
:root {
  --bg: #0d1117;
  --panel: #161c25;
  --line: #263041;
  --fg: #e6ebf2;
  --muted: #8592a6;
  --accent: #35d0ba;
  --bad: #ef6461;
  --display: "Heebo", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--display); }
main { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
h1 { margin: 0; font-weight: 800; font-size: 1.4rem; }
a { color: var(--accent); }
.stage { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 3 / 4; max-height: 55vh; width: 100%; }
video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; }
.meter { position: absolute; top: 8%; bottom: 8%; inset-inline-start: 10px; width: 14px; border-radius: 99px; border: 2px solid rgba(255,255,255,.5); overflow: hidden; }
.meter i { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: var(--accent); transition: height .08s linear; }
.hud { position: absolute; top: 10px; inset-inline-end: 10px; display: grid; gap: 6px; justify-items: end; }
.chip { font: 600 .85rem var(--mono); background: rgba(13,17,23,.78); padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; background: var(--sw, #000); }
.toast { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 1.5rem; font-weight: 800; text-shadow: 0 2px 10px #000; white-space: nowrap; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: 600 1rem var(--display); color: var(--fg); background: #1f2734; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: #062a24; border-color: transparent; }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .45; }
.status { font: .85rem var(--mono); padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); }
.status.on { color: var(--accent); border-color: var(--accent); }
.status.err { color: var(--bad); border-color: var(--bad); }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.g { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; gap: 10px; align-items: center; transition: border-color .15s, background .15s; }
.g .ico { font-size: 1.7rem; line-height: 1; }
.g b { display: block; font-size: .95rem; }
.g small { color: var(--muted); font-size: .8rem; }
.g.active { border-color: var(--accent); background: #12302c; }
.help { color: var(--muted); font-size: .9rem; margin: 0; }
.embedded header, .embedded #connect, .embedded #status { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>מחוות ידיים</h1>
    <a href="./">לדף הבדיקה</a>
  </header>

  <div class="stage">
    <div class="placeholder" id="ph">לחץ "התחבר לפס" ואז "הפעל מצלמה"</div>
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="meter" aria-hidden="true"><i id="meterFill"></i></div>
    <div class="hud">
      <span class="chip" id="gesture">אין יד</span>
      <span class="chip" id="fxChip">אפקט —</span>
      <div class="swatch" id="swatch"></div>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="row">
    <button class="primary" id="connect">התחבר לפס</button>
    <button id="cam">הפעל מצלמה</button>
    <span class="status" id="status">לא מחובר</span>
  </div>

  <div class="row" role="group" aria-label="מה גובה היד משנה">
    <span class="help">יד פתוחה למעלה ולמטה משנה:</span>
    <button data-h="speed" aria-pressed="true">מהירות</button>
    <button data-h="bright" aria-pressed="false">בהירות</button>
  </div>

  <div class="legend" id="legend"></div>
  <p class="help">כל מחווה פועלת פעם אחת. כדי להפעיל אותה שוב פתחו את היד ואז עשו אותה שוב.</p>
</main>

<script type="module">
import { sharedStrip, frames, colorFormat, hueToRgb } from "./led.js";
import { FilesetResolver, GestureRecognizer } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const strip = sharedStrip();
const fmt = colorFormat();

// ---- what each gesture does ----
const COLORS = [["אדום", 0], ["כתום", 30], ["צהוב", 55], ["ירוק", 120], ["תכלת", 185], ["כחול", 230], ["סגול", 275], ["ורוד", 320]];
const state = { fx: 0, color: -1, bright: 100, speed: 60, on: true, heightMode: "speed" };

const ACTIONS = {
  Closed_Fist: { ico: "✊", name: "אגרוף", does: "אפקט הבא", run: () => setFx(state.fx + 1) },
  Pointing_Up: { ico: "☝️", name: "אצבע למעלה", does: "אפקט קודם", run: () => setFx(state.fx - 1) },
  Victory:     { ico: "✌️", name: "סימן ניצחון", does: "צבע הבא", run: nextColor },
  Thumb_Up:    { ico: "👍", name: "אגודל למעלה", does: "הדלקה", run: () => power(true) },
  Thumb_Down:  { ico: "👎", name: "אגודל למטה", does: "כיבוי", run: () => power(false) },
  ILoveYou:    { ico: "🤟", name: "רוק", does: "הבהובי מסיבה", run: party },
  Wave:        { ico: "👋", name: "נפנוף שלום", does: "אפקט ריצה אקראי", run: randomRun },
  Open_Palm:   { ico: "🖐️", name: "יד פתוחה", does: "גובה = מהירות", run: null },
};

// The controller's running effects sit around ids 89-141 on this family of controllers.
const RUN_IDS = Array.from({ length: 27 }, (_, i) => 89 + i * 2);

function setFx(id) {
  state.fx = (id + 213) % 213;
  state.color = -1;
  strip.send(frames.fx(state.fx));
  strip.send(frames.spd(state.speed));
  toast(`אפקט ${state.fx}`);
  renderHud();
}
function nextColor() {
  state.color = (state.color + 1) % COLORS.length;
  const [name, hue] = COLORS[state.color];
  const [r, g, b] = hueToRgb(hue);
  strip.send(frames.rgb(r, g, b, fmt));
  toast(name);
  renderHud();
}
function power(on) {
  state.on = on;
  strip.send(on ? frames.on() : frames.off());
  toast(on ? "דולק" : "כבוי");
}
async function party() {
  toast("מסיבה!");
  for (let i = 0; i < 8; i++) {
    const [r, g, b] = hueToRgb((i * 137) % 360);
    await strip.send(frames.rgb(r, g, b, fmt));
    await new Promise(res => setTimeout(res, 110));
  }
  if (state.color >= 0) { const [r, g, b] = hueToRgb(COLORS[state.color][1]); strip.send(frames.rgb(r, g, b, fmt)); }
  else strip.send(frames.fx(state.fx));
}
function randomRun() {
  setFx(RUN_IDS[Math.floor(Math.random() * RUN_IDS.length)]);
  strip.send(frames.spd(90));
  toast("ריצה!");
}

// ---- UI ----
function renderLegend(active) {
  $("legend").innerHTML = Object.entries(ACTIONS).map(([k, a]) =>
    `<div class="g${k === active ? " active" : ""}"><span class="ico">${a.ico}</span><span><b>${a.name}</b><small>${k === "Open_Palm" ? (state.heightMode === "speed" ? "גובה = מהירות" : "גובה = בהירות") : a.does}</small></span></div>`
  ).join("");
}
function renderHud() {
  $("fxChip").textContent = state.color >= 0 ? `צבע ${COLORS[state.color][0]}` : `אפקט ${state.fx}`;
  $("swatch").style.background = state.color >= 0 ? `hsl(${COLORS[state.color][1]} 100% 50%)` : "conic-gradient(red, yellow, lime, cyan, blue, magenta, red)";
}
let toastTimer = 0;
function toast(t) { $("toast").textContent = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").textContent = "", 1200); }
renderLegend(); renderHud();

document.querySelectorAll("[data-h]").forEach(b => b.onclick = () => {
  state.heightMode = b.dataset.h;
  document.querySelectorAll("[data-h]").forEach(x => x.setAttribute("aria-pressed", x === b));
  renderLegend();
});

function setStatus(t, cls) { const s = $("status"); s.textContent = t; s.className = "status " + (cls || ""); }
$("connect").onclick = async () => {
  try { setStatus("מחפש…"); const name = await strip.connect(); setStatus("מחובר: " + name, "on"); }
  catch { setStatus("לא מחובר", "err"); }
};
strip.addEventListener("disconnect", () => setStatus("התנתק", "err"));

// ---- camera + gesture recognition ----
let recognizer = null;
$("cam").onclick = async () => {
  $("cam").disabled = true;
  $("ph").textContent = "טוען זיהוי מחוות…";
  try {
    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm");
    recognizer = await GestureRecognizer.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
        delegate: "GPU",
      },
      runningMode: "VIDEO",
      numHands: 1,
    });
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 }, audio: false });
    const v = $("video");
    v.srcObject = stream;
    await v.play();
    $("ph").hidden = true;
    requestAnimationFrame(loop);
  } catch (e) {
    $("ph").textContent = "לא הצלחתי לפתוח מצלמה: " + e.message;
    $("cam").disabled = false;
  }
};

const ctx = $("overlay").getContext("2d");
let lastVideoTime = -1;
let height = 0.5, lastHeightSent = { key: "", t: 0 };
let candidate = "", candidateSince = 0, armed = true, lastFired = "";
const xs = [];   // recent palm x positions, for wave detection

function loop() {
  const v = $("video"), c = $("overlay");
  if (v.currentTime !== lastVideoTime) {
    lastVideoTime = v.currentTime;
    const now = performance.now();
    const res = recognizer.recognizeForVideo(v, now);
    c.width = v.videoWidth; c.height = v.videoHeight;
    ctx.clearRect(0, 0, c.width, c.height);
    const hand = res.landmarks && res.landmarks[0];
    let g = "None";
    if (hand) {
      g = (res.gestures[0] && res.gestures[0][0] && res.gestures[0][0].score > 0.55) ? res.gestures[0][0].categoryName : "None";
      ctx.fillStyle = "rgba(53,208,186,.9)";
      for (const q of hand) { ctx.beginPath(); ctx.arc(q.x * c.width, q.y * c.height, 4, 0, 7); ctx.fill(); }
      const p = hand[9];
      xs.push({ x: p.x, t: now });
      if (g === "Open_Palm") {
        if (isWave(now)) g = "Wave";
        else heightControl(p.y, now);
      }
    } else xs.length = 0;
    while (xs.length && now - xs[0].t > 1200) xs.shift();
    handleGesture(g, now);
  }
  requestAnimationFrame(loop);
}

// A wave is an open palm swinging side to side at least three times within a second or so.
function isWave(now) {
  if (xs.length < 8) return false;
  let turns = 0, dir = 0, ext = xs[0].x;
  for (const { x } of xs) {
    const d = x - ext;
    if (dir >= 0 && d < -0.06) { if (dir > 0) turns++; dir = -1; ext = x; }
    else if (dir <= 0 && d > 0.06) { if (dir < 0) turns++; dir = 1; ext = x; }
    else if ((dir > 0 && x > ext) || (dir < 0 && x < ext)) ext = x;
  }
  return turns >= 3;
}

function heightControl(y, now) {
  const raw = Math.min(1, Math.max(0, (0.85 - y) / 0.7));
  height = height * 0.6 + raw * 0.4;
  $("meterFill").style.height = Math.round(height * 100) + "%";
  const v = Math.round(height * 100);
  const key = state.heightMode + Math.round(v / 4);
  if (!strip.connected || key === lastHeightSent.key || now - lastHeightSent.t < 90) return;
  lastHeightSent = { key, t: now };
  if (state.heightMode === "speed") { state.speed = v; strip.sendLatest(frames.spd(v)); }
  else { state.bright = Math.max(1, v); strip.sendLatest(frames.bri(state.bright)); }
}

// A gesture fires once after being held steady for 250 ms; it re-arms when the hand opens or leaves.
function handleGesture(g, now) {
  const a = ACTIONS[g];
  $("gesture").textContent = a ? `${a.ico} ${a.name}` : (g === "None" ? "יד" : g);
  if (g !== candidate) { candidate = g; candidateSince = now; }
  if (g === "None" || g === "Open_Palm") { armed = true; renderLegendOnce(g); return; }
  if (!a || !a.run || now - candidateSince < 250) return;
  if (!armed && g === lastFired) return;
  if (g === "Wave" && lastFired === "Wave" && !armed) return;
  armed = false; lastFired = g;
  if (g === "Wave") xs.length = 0;
  if (strip.connected) a.run(); else toast(a.does + " (הפס לא מחובר)");
  renderLegendOnce(g);
}
let legendShown = "";
function renderLegendOnce(g) { if (g !== legendShown) { legendShown = g; renderLegend(g); } }
</script>
</body>
</html>
