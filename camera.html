<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LedGame Hand Control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: camera fills the top, a vertical "height meter" sits on its edge; controls dock below. Single dark look. */
:root {
  --bg: #0d1117;
  --panel: #161c25;
  --line: #263041;
  --fg: #e6ebf2;
  --muted: #8592a6;
  --accent: #35d0ba;
  --good: #5ad17a;
  --bad: #ef6461;
  --display: "Heebo", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--display); }
main { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
h1 { margin: 0; font-weight: 800; font-size: 1.4rem; }
a { color: var(--accent); }
.stage { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 3 / 4; max-height: 62vh; width: 100%; }
video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.meter { position: absolute; top: 8%; bottom: 8%; inset-inline-start: 10px; width: 14px; border-radius: 99px; border: 2px solid rgba(255,255,255,.5); overflow: hidden; }
.meter i { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: var(--meter, var(--accent)); transition: height .08s linear; }
.hud { position: absolute; top: 10px; inset-inline-end: 10px; display: grid; gap: 6px; justify-items: end; }
.chip { font: 600 .85rem var(--mono); background: rgba(13,17,23,.75); padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); }
.target { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 24px var(--tgt, #000); background: var(--tgt, #000); }
.big { position: absolute; inset: 0; display: grid; place-items: center; font-size: 3.2rem; font-weight: 800; text-shadow: 0 2px 12px #000; pointer-events: none; }
.placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: 600 1rem var(--display); color: var(--fg); background: #1f2734; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: #062a24; border-color: transparent; }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .45; }
.status { font: .85rem var(--mono); padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); }
.status.on { color: var(--accent); border-color: var(--accent); }
.status.err { color: var(--bad); border-color: var(--bad); }
.help { color: var(--muted); font-size: .9rem; margin: 0; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.embedded header, .embedded #connect, .embedded #status { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>שליטה ביד</h1>
    <a href="./">לדף הבדיקה</a>
  </header>

  <div class="stage">
    <div class="placeholder" id="ph">לחץ "הפעל מצלמה" והחזק את היד מול המצלמה הקדמית</div>
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="meter" aria-hidden="true"><i id="meterFill"></i></div>
    <div class="hud">
      <span class="chip" id="hand">אין יד</span>
      <span class="chip" id="score" hidden>0 נק' · 30s</span>
      <div class="target" id="target" hidden></div>
    </div>
    <div class="big" id="big"></div>
  </div>

  <div class="row">
    <button class="primary" id="connect">התחבר לפס</button>
    <button id="cam">הפעל מצלמה</button>
    <span class="status" id="status">לא מחובר</span>
  </div>

  <div class="modes" role="group" aria-label="מצב">
    <button data-mode="color" aria-pressed="true">צבע</button>
    <button data-mode="bright" aria-pressed="false">בהירות</button>
    <button data-mode="game" aria-pressed="false">משחק</button>
  </div>
  <p class="help" id="help"></p>
</main>

<script type="module">
import { sharedStrip, frames, colorFormat, hueToRgb } from "./led.js?v=5";
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const strip = sharedStrip();
const fmt = colorFormat();
const HELP = {
  color: "הרם את היד למעלה לאדום, הורד אותה למטה לסגול. כל גובה באמצע הוא צבע אחר.",
  bright: "יד למעלה זה פס מלא אור, יד למטה זה כמעט כבוי.",
  game: "בעיגול למעלה מופיע צבע מטרה. הזז את היד עד שהפס בצבע הזה והחזק שנייה. 30 שניות, כמה תספיק?",
};

let mode = "color";
let height = 0.5;          // smoothed hand height, 0 = bottom, 1 = top
let seen = false;
let lastSent = { key: "", t: 0 };

function setStatus(t, cls) { const s = $("status"); s.textContent = t; s.className = "status " + (cls || ""); }
$("help").textContent = HELP.color;

$("connect").onclick = async () => {
  try {
    setStatus("מחפש…");
    const name = await strip.connect();
    await strip.send(frames.on());
    await strip.send(frames.bri(100));
    setStatus("מחובר: " + name, "on");
  } catch (e) { setStatus("לא מחובר", "err"); }
};
strip.addEventListener("disconnect", () => setStatus("התנתק", "err"));

document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("help").textContent = HELP[mode];
  lastSent.key = "";
  if (mode === "game") startGame(); else stopGame();
  if (mode === "bright" && strip.connected) strip.send(frames.rgb(255, 255, 255, fmt));
  if (mode !== "bright" && strip.connected) strip.send(frames.bri(100));
});

// ---- hand tracking ----
let landmarker = null;
$("cam").onclick = async () => {
  $("cam").disabled = true;
  $("ph").textContent = "טוען זיהוי ידיים…";
  try {
    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm");
    landmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "GPU",
      },
      runningMode: "VIDEO",
      numHands: 1,
    });
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 }, audio: false });
    const v = $("video");
    v.srcObject = stream;
    await v.play();
    $("ph").hidden = true;
    requestAnimationFrame(loop);
  } catch (e) {
    $("ph").textContent = "לא הצלחתי לפתוח מצלמה: " + e.message;
    $("cam").disabled = false;
  }
};

const ctx = $("overlay").getContext("2d");
let lastVideoTime = -1;
function loop() {
  const v = $("video"), c = $("overlay");
  if (v.currentTime !== lastVideoTime) {
    lastVideoTime = v.currentTime;
    const res = landmarker.detectForVideo(v, performance.now());
    c.width = v.videoWidth; c.height = v.videoHeight;
    ctx.clearRect(0, 0, c.width, c.height);
    const hand = res.landmarks && res.landmarks[0];
    seen = !!hand;
    if (hand) {
      // Landmark 9 is the base of the middle finger: steady and near the palm centre.
      const p = hand[9];
      const raw = Math.min(1, Math.max(0, (0.85 - p.y) / 0.7));
      height = height * 0.6 + raw * 0.4;
      ctx.fillStyle = "rgba(53,208,186,.9)";
      for (const q of hand) { ctx.beginPath(); ctx.arc(q.x * c.width, q.y * c.height, 4, 0, 7); ctx.fill(); }
      ctx.beginPath(); ctx.arc(p.x * c.width, p.y * c.height, 14, 0, 7); ctx.lineWidth = 4; ctx.strokeStyle = "#fff"; ctx.stroke();
    }
    $("hand").textContent = seen ? `גובה ${Math.round(height * 100)}%` : "אין יד";
    update();
  }
  requestAnimationFrame(loop);
}

// ---- mapping hand height to the strip ----
const heightToHue = h => Math.round((1 - h) * 300);   // top red, bottom violet

function update() {
  const fill = $("meterFill");
  fill.style.height = Math.round(height * 100) + "%";
  if (mode === "bright") {
    const v = Math.round(height * 100);
    fill.style.setProperty("--meter", `hsl(0 0% ${20 + v * 0.8}%)`);
    push("b" + Math.round(v / 3), () => frames.bri(Math.max(1, v)));
  } else {
    const hue = heightToHue(height);
    fill.style.setProperty("--meter", `hsl(${hue} 100% 50%)`);
    if (mode === "game" && !game.on) return;   // round over: leave the celebration effect running
    if (!game.flashing) {
      const [r, g, b] = hueToRgb(hue);
      push("c" + Math.round(hue / 6), () => frames.rgb(r, g, b, fmt));
    }
    if (mode === "game") tickGame(hue);
  }
}

// Sends only when the value moved and at most ~12 times a second.
function push(key, make) {
  const now = performance.now();
  if (!seen || !strip.connected || key === lastSent.key || now - lastSent.t < 80) return;
  lastSent = { key, t: now };
  strip.sendLatest(make());
}

// ---- game: match the target colour ----
const game = { on: false, target: 0, holdStart: 0, score: 0, ends: 0, flashing: false, timer: 0 };
const hueDist = (a, b) => Math.min(Math.abs(a - b), 360 - Math.abs(a - b));

function newTarget() {
  let t;
  do { t = Math.round(Math.random() * 300); } while (hueDist(t, game.target) < 60);
  game.target = t;
  $("target").style.setProperty("--tgt", `hsl(${t} 100% 50%)`);
}
function startGame() {
  Object.assign(game, { on: true, score: 0, holdStart: 0, ends: performance.now() + 30000 });
  newTarget();
  $("target").hidden = false; $("score").hidden = false; $("big").textContent = "";
  clearInterval(game.timer);
  game.timer = setInterval(renderScore, 250);
}
function stopGame() {
  game.on = false; clearInterval(game.timer);
  $("target").hidden = true; $("score").hidden = true; $("big").textContent = "";
}
function renderScore() {
  const left = Math.max(0, Math.ceil((game.ends - performance.now()) / 1000));
  $("score").textContent = `${game.score} נק' · ${left}s`;
  if (left === 0 && game.on) {
    game.on = false; clearInterval(game.timer);
    $("big").textContent = `${game.score} נקודות!`;
    if (strip.connected) strip.send(frames.fx(0));   // celebrate with the controller's auto-play
  }
}
function tickGame(hue) {
  if (!game.on || game.flashing) return;
  if (seen && hueDist(hue, game.target) < 18) {
    if (!game.holdStart) game.holdStart = performance.now();
    if (performance.now() - game.holdStart > 900) score();
  } else game.holdStart = 0;
}
async function score() {
  game.score++; game.holdStart = 0; game.flashing = true;
  $("big").textContent = "+1";
  if (strip.connected) {
    for (let i = 0; i < 2; i++) {
      await strip.send(frames.rgb(255, 255, 255, fmt));
      await new Promise(r => setTimeout(r, 120));
      await strip.send(frames.rgb(0, 0, 0, fmt));
      await new Promise(r => setTimeout(r, 120));
    }
  }
  game.flashing = false; lastSent.key = "";
  $("big").textContent = "";
  newTarget();
}
</script>
</body>
</html>
